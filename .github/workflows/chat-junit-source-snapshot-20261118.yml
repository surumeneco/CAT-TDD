name: Chat isolated CAT source snapshot 20261118
on:
  push:
    branches: ['infra/chat-junit-source-snapshot-20261118']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b320fcea0135d9f750650514b28008a45750f63
          persist-credentials: false
      - name: Verify exact commit and archive
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '3b320fcea0135d9f750650514b28008a45750f63'
          printf '%s\n' 'surumeneco/CAT-TDD' '3b320fcea0135d9f750650514b28008a45750f63' "$(git rev-parse HEAD^{tree})" > snapshot.manifest
          git archive --format=tar HEAD > source.tar
          sha256sum source.tar > source.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cat-junit-source-20261118
          path: |
            source.tar
            source.tar.sha256
            snapshot.manifest
          retention-days: 1
