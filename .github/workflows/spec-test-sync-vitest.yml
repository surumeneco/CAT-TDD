name: Spec-test-sync generated Vitest acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/spec-test-sync-vitest.yml'
      - '.cat-system/scripts/cat_spec_test_sync.py'
      - '.cat-system/scripts/cat_suite_manifest.py'
      - '.cat-system/scripts/cat_compile_v2.py'
      - '.cat-system/scripts/cat_flow.py'
      - 'tests/test_compile_cli_replay.py'
      - '.cat-system/scripts/cat_model_conformance.py'
      - '.cat-system/skills/tech-vitest/scripts/**'
      - 'tests/test_spec_test_sync_integration.py'
      - 'tests/test_multi_owner_output_presence.py'
      - 'tests/test_observed_transport.py'
      - 'tests/test_observed_structural_relations.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce tests from actual Confirmed CAT artifacts and Gate evidence
        env:
          CAT_SYNC_VITEST_SMOKE_DIR: ${{ github.workspace }}/.cat-vitest-smoke/tests/generated
        run: python -m unittest discover -s tests -p test_spec_test_sync_integration.py -v
      - name: Install an isolated real Vitest runner
        working-directory: .cat-vitest-smoke
        run: |
          printf '{"private":true,"type":"module","devDependencies":{"vitest":"2.1.9","typescript":"5.8.3"}}\n' > package.json
          npm install --no-audit --no-fund
      - name: Verify generated tests accept conforming implementation
        working-directory: .cat-vitest-smoke
        run: |
          npx vitest run tests/generated --reporter=junit --outputFile=vitest-green.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('vitest-green.xml').getroot().findall('.//testcase')
          assert len(cases) == 2, len(cases)
          assert all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases)
          print('real Vitest confirmed: 2 passing tests')
          PY
      - name: Verify generated tests reject nonconforming implementation
        working-directory: .cat-vitest-smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/generated/driver.ts')
          source = p.read_text()
          before = "return { 'output.accepted': enabled };"
          assert source.count(before) == 1
          p.write_text(source.replace(before, "return { 'output.accepted': !enabled };"))
          PY
          set +e
          npx vitest run tests/generated --reporter=junit --outputFile=vitest-red.xml
          code=$?
          set -e
          test "$code" -ne 0
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('vitest-red.xml').getroot().findall('.//testcase')
          assert len(cases) == 2, len(cases)
          assert sum(c.find('failure') is not None or c.find('error') is not None for c in cases) >= 1
          print('real Vitest confirmed: incorrect implementation rejected')
          PY
      - name: Produce multi-owner output vectors and generated tests from source
        env:
          CAT_MULTI_OWNER_VITEST_SMOKE_DIR: ${{ github.workspace }}/.cat-vitest-smoke/tests/multi-owner
        run: python -m unittest discover -s tests -p test_multi_owner_output_presence.py -v
      - name: Verify correlated multi-owner outputs using real Vitest
        working-directory: .cat-vitest-smoke
        run: |
          for mode in direct alternate missing extra wrong-owner wrong-pair missing-field absent; do
            set +e
            CAT_MULTI_OWNER_MODE="$mode" npx vitest run tests/multi-owner --reporter=junit --outputFile="multi-owner-$mode.xml"
            code=$?
            set -e
            python - "$mode" "$code" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          mode, code = sys.argv[1], int(sys.argv[2])
          cases = ET.parse('multi-owner-' + mode + '.xml').getroot().findall('.//testcase')
          assert len(cases) == 2, len(cases)
          assert all(c.find('skipped') is None for c in cases)
          failures = [c for c in cases if c.find('failure') is not None or c.find('error') is not None]
          if mode in ('direct', 'alternate'):
              assert code == 0 and not failures, (mode, code, failures)
          else:
              expected = 'case.second.reply' if mode == 'absent' else 'case.first.reply'
              assert code != 0 and len(failures) == 1 and expected in failures[0].get('name', ''), (mode, code, failures)
          print('real Vitest multi-owner mode:', mode, 'validated')
          PY
          done
      - name: Produce observation and combined observation/frame tests
        env:
          CAT_OBS_VITEST_SMOKE_DIR: ${{ github.workspace }}/.cat-vitest-smoke/tests/observation
          CAT_COMBINED_VITEST_SMOKE_DIR: ${{ github.workspace }}/.cat-vitest-smoke/tests/combined
        run: python -m unittest discover -s tests -p test_observed_transport.py -v
      - name: Execute actual observed Vitest positive and negative cases
        working-directory: .cat-vitest-smoke
        run: |
          python - <<'PY'
          import os, subprocess
          import xml.etree.ElementTree as ET
          plans = {
              'observation': ('CAT_OBS_MODE', {'direct': 0, 'wrong-observation': 2, 'missing': 2, 'extra': 2, 'wrong-output': 2}),
              'combined': ('CAT_COMBINED_MODE', {'direct': 0, 'alternate': 0, 'wrong-observation': 1, 'wrong-owner': 1, 'wrong-pair': 1, 'wrong-state': 1})
          }
          for fixture, (key, modes) in plans.items():
              for mode, count in modes.items():
                  report = fixture + '-' + mode + '.xml'
                  run = subprocess.run(['npx','vitest','run','tests/'+fixture,'--reporter=junit','--outputFile='+report], env={**os.environ,key:mode})
                  cases = ET.parse(report).getroot().findall('.//testcase')
                  assert len(cases)==2 and not any(c.find('skipped') is not None or c.find('error') is not None for c in cases), (fixture, mode, cases)
                  failures = [c for c in cases if c.find('failure') is not None]
                  assert len(failures)==count and (run.returncode!=0)==bool(count), (fixture,mode,run.returncode,failures)
                  if fixture=='combined' and count: assert 'case.first.reply' in failures[0].get('name',''), failures
                  if mode in ('wrong-observation','missing','extra'):
                      assert all('CAT observed coordinates differ' in (c.find('failure').get('message','')+(c.find('failure').text or '')) for c in failures)
                  print('actual Vitest:', fixture, mode, 'validated')
          PY
