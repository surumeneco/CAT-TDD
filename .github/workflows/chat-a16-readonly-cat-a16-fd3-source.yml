name: cat-a16-fd3-source read-only pinned source
on:
  push:
    branches: ['infra/chat-a16-cat-fd3-snapshot-20261118']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fd3f5c7e0646627780250dcc3fa5684d35a5f9cd
          persist-credentials: false
      - name: Archive verified exact commit
        run: |
          test "$(git rev-parse HEAD)" = 'fd3f5c7e0646627780250dcc3fa5684d35a5f9cd'
          printf '%s\n' 'surumeneco/CAT-TDD' 'fd3f5c7e0646627780250dcc3fa5684d35a5f9cd' "$(git rev-parse HEAD^{tree})" > snapshot.manifest
          git archive --format=tar HEAD > source.tar
          sha256sum source.tar > source.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cat-a16-fd3-source
          path: |
            source.tar
            source.tar.sha256
            snapshot.manifest
          retention-days: 1
