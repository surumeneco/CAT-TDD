name: CAT-TDD tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Export revision-pinned CAT runtime for offline WebApp verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-runtime-source
          path: |
            .cat-system/
            tests/
          include-hidden-files: true
          retention-days: 2
